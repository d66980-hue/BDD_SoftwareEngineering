# For MySQL (uncomment if using MySQL in Docker)
# Datasource — overridden by Docker environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:devdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=true